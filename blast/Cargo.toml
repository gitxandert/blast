[package]
name = "blast"
version = "0.1.0"
edition = "2024"
publish = false

# The approved set (plans/README.md §1.1). Tasks never edit this file; new
# crates need the user's approval.
[dependencies]
blast_macros = { path = "../blast_macros" }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "aiff", "pcm", "adpcm", "flac", "mpa", "aac", "alac", "isomp4"] }
rubato = { version = "5.0.1", default-features = false }
cpal = "0.18.2"
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
rtrb = "0.4.0"
hound = "3.5.1"
lexopt = "0.3.2"
# Until R1 removes the hand-written ALSA and termios code. alsa-sys must stay
# on the same version as cpal's (links = "alsa" allows only one copy).
alsa-sys = "0.4.0"
libc = "0.2.177"
